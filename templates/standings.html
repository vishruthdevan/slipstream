{% extends "base.html" %}
{% block content %}
<h2 class="text-center">F1 Driver Standings - {{ selected_year }}</h2>

<!-- Year Selection -->
<div class="text-center mb-3">
  <label for="year-select" class="text-light">Select Year:</label>
  <select id="year-select" class="form-select w-auto d-inline" onchange="changeYear()">
    {% for year in range(2025, 1960, -1) %}
    <option value="{{ year }}" {% if year==selected_year|int %}selected{% endif %}>
      {{ year }}
    </option>
    {% endfor %}
  </select>
</div>

<!-- Standings Table -->
<div class="table-responsive">
  <table class="table table-striped table-dark table-hover" style="border-radius: 10px; overflow: hidden;">
    <thead>
      <tr>
        <th class="text-center">Driver</th>
        <th class="text-center">Points</th>
        <th class="text-center">Wins</th>
      </tr>
    </thead>
    <tbody>
      {% for standing in standings %}
      <tr onclick="window.location='{{ url_for('drivers.driver_detail', driver_id=standing.driver_id) }}'"
        style="cursor: pointer">
        <td class="text-center">{{ standing.name }}</td>
        <td class="text-center">{{ standing.points }}</td>
        <td class="text-center">{{ standing.wins }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
  // Change the year and reload the page with the selected year
  function changeYear() {
    var selectedYear = document.getElementById("year-select").value;
    window.location.href = "?year=" + selectedYear;
  }
</script>
{% endblock %}
