{% extends "base.html" %}
{% block content %}
<h2 class="text-center">F1 Races</h2>

<!-- Year Selection -->
<div class="text-center mb-3">
  <label for="year-select" class="text-light">Select Year:</label>
  <select id="year-select" class="form-select w-auto d-inline" onchange="changeYear()">
    {% for year in range(2025, 1960, -1) %}
    <option value="{{ year }}" {% if year==selected_year|int %}selected{% endif %}>
      {{ year }}
    </option>
    {% endfor %}
  </select>
</div>

<div class="table-responsive">
  <table class="table table-striped table-dark table-hover">
    <thead>
      <tr>
        <th>Race Name</th>
        <th>Date</th>
        <th>Results</th>
      </tr>
    </thead>
    <tbody>
      {% for race in races %}
      <tr onclick="window.location='/races/{{ race.id }}';" style="cursor: pointer">
        <td>{{ race.name }}</td>
        <td>{{ race.date }}</td>
        <td>
          <a href="{{ url_for('race_results.race_results', race_id=race.id) }}" class="btn btn-primary btn-sm">Race
            Results</a>
          <a href="{{ url_for('qualifying_results.qualifying_results', race_id=race.id) }}"
            class="btn btn-secondary btn-sm">Qualifying Results</a>
          <a href="{{ url_for('sprint_results.sprint_results', race_id=race.id) }}"
            class="btn btn-success btn-sm">Sprint Results</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
  // Change the year and reload the page with the selected year
  function changeYear() {
    var selectedYear = document.getElementById("year-select").value;
    window.location.href = "?year=" + selectedYear;
  }
</script>
{% endblock %}
