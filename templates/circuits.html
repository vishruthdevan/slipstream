{% extends "base.html" %} {% block fullcontent %}
<h2 class="text-center text-light">F1 Circuits</h2>

<!-- Fullscreen Map Container -->
<div
  id="map-container"
  style="width: 100vw; height: 90vh, margin: 0; padding: 0;"
>
  <svg id="world-map" width="100%" height="100%"></svg>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var width = window.innerWidth, height = window.innerHeight * 0.9;

    // Create an SVG element that covers the entire page (100% width and 90% height of the viewport)
    var svg = d3.select("#world-map")
      .attr("width", width)
      .attr("height", height);

    // Projection: Mercator projection focused on Europe
    var projection = d3.geoMercator()
      .scale(1000)  // Increased scale to zoom in
      .center([10, 50])  // Centered roughly around Central Europe
      .translate([width / 2, height / 2]);

    var path = d3.geoPath().projection(projection);

    // Enable zooming & panning functionality on the map
    var zoom = d3.zoom()
      .scaleExtent([1, 8])  // Limits zoom levels between 1x and 8x
      .on("zoom", function (event) {
        svg.selectAll("path, circle, text").attr("transform", event.transform);  // Apply zoom transformations
      });

    svg.call(zoom);

    // Load the world map data from a GeoJSON file and append the map to the SVG container
    d3.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson").then(function (world) {
      svg.append("g")
        .selectAll("path")
        .data(world.features)  // Features of the world map (countries)
        .enter()
        .append("path")
        .attr("d", path)  // Generate paths for each country using the projection
        .attr("fill", "#333")  // Color the countries dark gray
        .attr("stroke", "#aaa");  // Light gray border

      // Get circuit data passed from Flask and plot the circuit locations
      var circuits = {{ circuits | tojson }};  // Data passed from the server (Flask)

      // Create red circles for each circuit on the map
      svg.selectAll("circle")
        .data(circuits)
        .enter()
        .append("circle")
        .attr("cx", d => projection([d.longitude, d.latitude])[0])  // Calculate x position based on longitude
        .attr("cy", d => projection([d.longitude, d.latitude])[1])  // Calculate y position based on latitude
        .attr("r", 5)  // Radius of the circle (size of the circuit marker)
        .attr("fill", "red")  // Initial fill color for the circle
        .attr("stroke", "white")  // White border for the circle
        .attr("stroke-width", 1.5)  // Width of the circle border
        .style("cursor", "pointer")  // Change cursor to a pointer on hover
        .on("mouseover", function () { d3.select(this).attr("fill", "yellow"); })  // Change color to yellow on hover
        .on("mouseout", function () { d3.select(this).attr("fill", "red"); })  // Change back to red when hover ends
        .on("click", function (event, d) { window.location.href = `/circuits/${d.id}/`; });  // Redirect to circuit detail page on click

      // Add text labels next to each circuit
      svg.selectAll("text")
        .data(circuits)
        .enter()
        .append("text")
        .attr("x", d => projection([d.longitude, d.latitude])[0] + 7)  // Position label slightly to the right of the circle
        .attr("y", d => projection([d.longitude, d.latitude])[1] + 3)  // Position label slightly below the circle
        .attr("fill", "white")  // White text color
        .attr("font-size", "10px")  // Font size for labels
        .attr("font-family", "Arial")  // Font family for labels
        .text(d => d.name);  // Display circuit name as label
    });
  });
</script>

{% endblock %}
