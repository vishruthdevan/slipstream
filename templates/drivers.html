{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <h2 class="text-center">F1 Drivers</h2>

  <div class="table-responsive" style="border-radius: 10px; overflow: hidden">
    <table
      id="driversTable"
      class="table table-hover table-striped shadow-sm table-dark"
    >
      <thead class="table-dark">
        <tr>
          <th onclick="sortTable(0)">Name</th>
          <th onclick="sortTable(1)">Nationality</th>
          <th onclick="sortTable(2)">Podiums</th>
        </tr>
      </thead>
      <tbody>
        {% for driver in drivers %}
        <tr
          onclick="window.location='{{ url_for('drivers.driver_detail', driver_id=driver.id) }}'"
          style="cursor: pointer"
        >
          <td>{{ driver.name }}</td>
          <td>{{ driver.nationality }}</td>
          <td>{{ driver.podiums }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<script>
  // Function to sort the table based on the specified column index
  function sortTable(columnIndex) {
    var table,
      rows,
      switching,
      i,
      x,
      y,
      shouldSwitch,
      dir,
      switchcount = 0;
    table = document.getElementById("driversTable"); // Get the table element by its ID
    switching = true; // Flag to check if the table still needs sorting
    dir = "asc"; // Set the initial sorting direction to ascending

    // Loop to continue sorting as long as switching is needed
    while (switching) {
      switching = false;
      rows = table.rows; // Get all the rows of the table
      // Loop through all table rows (excluding the header row at index 0)
      for (i = 1; i < rows.length - 1; i++) {
        shouldSwitch = false;
        x = rows[i].getElementsByTagName("TD")[columnIndex]; // Get the current row's cell (column) value for comparison
        y = rows[i + 1].getElementsByTagName("TD")[columnIndex]; // Get the next row's cell (column) value for comparison

        // Check if the rows should switch based on the current sorting direction
        if (dir == "asc") {
          if (columnIndex === 2) {
            // For numeric columns like podiums (e.g., positions), compare numeric values
            if (parseInt(x.innerHTML) > parseInt(y.innerHTML)) {
              shouldSwitch = true; // Mark for switching
              break;
            }
          } else {
            // For textual columns (name, nationality), compare alphabetically (case-insensitive)
            if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
              shouldSwitch = true; // Mark for switching
              break;
            }
          }
        } else if (dir == "desc") {
          if (columnIndex === 2) {
            // For numeric columns like podiums, compare numeric values
            if (parseInt(x.innerHTML) < parseInt(y.innerHTML)) {
              shouldSwitch = true; // Mark for switching
              break;
            }
          } else {
            // For textual columns (name, nationality), compare alphabetically (case-insensitive)
            if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
              shouldSwitch = true; // Mark for switching
              break;
            }
          }
        }
      }

      // If a switch is needed, perform the row swap
      if (shouldSwitch) {
        rows[i].parentNode.insertBefore(rows[i + 1], rows[i]); // Move the row down
        switching = true; // Set switching flag to continue sorting
        switchcount++; // Increment the switch count to track how many switches were made
      } else {
        // If no switch was made and the sorting direction was ascending, change direction to descending
        if (switchcount == 0 && dir == "asc") {
          dir = "desc"; // Change sorting direction to descending
          switching = true; // Set switching flag to continue sorting
        }
      }
    }
  }
</script>

{% endblock %}
